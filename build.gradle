buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9.4 officially supports compileSdk/targetSdk 37 (Android 17); requires Gradle >= 9.6 and JDK >= 17.
        classpath 'com.android.tools.build:gradle:9.4.0'
    }
}

allprojects {
    version = '1.0'
    ext {
        appName = 'projekt-karpador'
        gdxVersion = '1.14.2'
    }

    repositories {
        google()
        mavenCentral()
    }
}

// The legacy desktop (LWJGL2), html (GWT 0.5 plugin) and ios (RoboVM 0.0.x) modules
// depended on long-dead build plugins and are not part of the build anymore.
// Their sources are left untouched in the repository.

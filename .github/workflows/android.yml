name: Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (targetSdk 37 / Android 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        # Accepts SDK licenses; AGP then auto-installs platform 37 + build-tools on first build.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :android:assembleDebug :android:assembleRelease

      - name: Verify target SDK and 64-bit / 16 KB-aligned natives
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/build/outputs/apk/release/android-release.apk
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
          "$BT/aapt2" dump badging "$APK" | grep -q "targetSdkVersion:'37'"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | tail -n 3

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: projekt-karpador-apk
          path: android/build/outputs/apk/**/*.apk
          if-no-files-found: error

apply plugin: 'com.android.application'

android {
    namespace = 'com.martinimoe.projektkarpador.android'
    compileSdk 37

    defaultConfig {
        applicationId 'com.martinimoe.projektkarpador.android'
        minSdk 23
        targetSdk 37   // Android 17
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.setSrcDirs(['src'])
            res.setSrcDirs(['res'])
            assets.setSrcDirs(['assets'])
            jniLibs.setSrcDirs(['libs'])
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml', '**/*.gwt.xml']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the CI artifact is directly installable.
            // Replace with a real signing config before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-$abi"
        natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-$abi"
    }
}

// Extracts the libGDX native .so files into libs/<abi>/ so they are packaged into the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        def abis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        abis.each { file("libs/$it/").mkdirs() }
        configurations.natives.copy().files.each { jar ->
            def abi = abis.find { jar.name.endsWith("natives-${it}.jar") }
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    into file("libs/$abi")
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    it.dependsOn 'copyAndroidNatives'
}
